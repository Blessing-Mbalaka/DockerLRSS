{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ status_code }} - {{ title }} | CHIETA LMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f4f6f9; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Segoe UI', Arial, sans-serif; }
        .error-card { max-width: 560px; width: 100%; background: #fff; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,.08); padding: 2.5rem; text-align: center; border-top: 6px solid #0d6efd; }
        .error-card img { max-height: 70px; margin-bottom: 1.25rem; }
        .error-code { font-size: 4.5rem; font-weight: 700; color: #0d6efd; line-height: 1; }
        .error-title { font-size: 1.5rem; margin: .75rem 0 .5rem; }
    </style>
</head>
<body>
    <div class="error-card">
        <img src="{% static 'core/images/logo chieta.png' %}" alt="CHIETA">
        <div class="error-code">{{ status_code }}</div>
        <h1 class="error-title">{{ title }}</h1>
        <p class="text-muted">{{ message }}</p>
        <div class="d-flex gap-2 justify-content-center mt-4">
            <a href="/" class="btn btn-primary">Go to Home</a>
            <a href="javascript:history.back()" class="btn btn-outline-secondary">Go Back</a>
        </div>
        <p class="small text-muted mt-4 mb-0">If the problem persists, please contact your system administrator.</p>
    </div>
</body>
</html>
