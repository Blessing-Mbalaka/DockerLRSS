<section class="cover-card" id="learner-cover"><h3>Learner cover details</h3><p>Check your details before submitting. These are saved with your written assessment.</p><table style="width:100%"><tbody>{% for label, value in learner_cover.items %}<tr><th><label for="cover-{{ forloop.counter0 }}">{{ label }}</label></th><td><input id="cover-{{ forloop.counter0 }}" name="cover_{{ forloop.counter0 }}" value="{{ value }}" maxlength="300" style="width:100%;padding:8px" {% if label == 'Student number' or label == 'Duration' %}readonly{% endif %}></td></tr>{% endfor %}</tbody></table></section>
