<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}ETQA{% endblock %}</title>
<style>body{font:16px system-ui;background:#f6f5f8;color:#25202b;margin:0}main{max-width:1250px;margin:auto;padding:24px}nav{display:flex;gap:24px;padding:20px;background:#3a063a}nav a{color:white}h1{font-size:28px}table{width:100%;border-collapse:collapse;background:white}td,th{text-align:left;padding:14px;border-bottom:1px solid #ddd;vertical-align:top}button,.button{display:inline-block;background:#198754;color:white;padding:9px 14px;border:0;border-radius:5px;text-decoration:none;cursor:pointer}input{padding:8px;max-width:100%}.message{padding:12px;background:#e4f1e9;margin:10px 0}.muted{color:#605b66}form{display:grid;gap:9px}label{display:block}.scroll{overflow-x:auto}</style><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">{% include "core/etqa/_sidebar_styles.html" %}</head><body class="etqa-layout">
{% if request.user.role == 'assessment_center' %}{% include "core/assessment-center/_sidebar.html" %}{% else %}{% include "core/etqa/_sidebar.html" %}{% endif %}<main>{% for message in messages %}<div role="status" class="message">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</main></body></html>
